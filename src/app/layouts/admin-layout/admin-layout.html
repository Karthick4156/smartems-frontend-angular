<div class="flex h-screen bg-gray-100">

  <!-- SIDEBAR -->
  <aside [class.w-64]="isOpen" [class.w-20]="!isOpen"
    class="bg-gray-900 text-white flex flex-col transition-all duration-300 shadow-lg">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-4 py-4 border-b border-white">
      <span *ngIf="isOpen" class="text-lg font-semibold tracking-wide">
        Smart EMS
      </span>

      <button (click)="toggleSidebar()" mat-icon-button
        class="hover:bg-blue-800 rounded-lg transition-all duration-200">
        <mat-icon class="text-white" [class.rotate-180]="!isOpen"
          style="transition: transform 0.3s ease">menu</mat-icon>
      </button>
    </div>

    <!-- MENU -->
    <nav class="flex-1 px-2 py-4 space-y-2 text-sm">

      <!-- Dashboard -->
      <a routerLink="/admin/dashboard" routerLinkActive="bg-white text-black font-medium"
        class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-600 transition-all duration-200">
        <mat-icon>dashboard</mat-icon>
        <span *ngIf="isOpen">Dashboard</span>
      </a>

      <!-- Employees -->
      <a routerLink="/admin/employees" routerLinkActive="bg-white text-black font-medium"
        class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-600 transition-all duration-200">
        <mat-icon>groups</mat-icon>
        <span *ngIf="isOpen">Employees</span>
      </a>

      <!-- Leaves -->
      <a routerLink="/admin/leaves" routerLinkActive="bg-white text-black font-medium"
        class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-600 transition-all duration-200">
        <mat-icon>event_note</mat-icon>
        <span *ngIf="isOpen">Leaves</span>
      </a>

      <!-- Corrections -->
      <a routerLink="/admin/corrections" routerLinkActive="bg-white text-black font-medium"
        class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-600 transition-all duration-200">
        <mat-icon>edit</mat-icon>
        <span *ngIf="isOpen">Corrections</span>
      </a>

    </nav>

    <!-- LOGOUT -->
    <div class="p-3 border-t border-white">
      <button
        class="flex items-center gap-3 w-full px-3 py-2 rounded-lg hover:bg-red-600 transition-all duration-200 text-white"
        (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span *ngIf="isOpen">Logout</span>
      </button>
    </div>

  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col">

    <!-- TOPBAR -->
    <header class="bg-white shadow-sm px-6 py-3 flex justify-between items-center">

      <h1 class="text-lg font-semibold text-gray-800">
        Admin Panel
      </h1>

      <!-- PROFILE -->
      <div
        class="flex items-center gap-2 md:gap-3 cursor-pointer hover:bg-gray-100 px-2 md:px-3 py-2 rounded-lg transition"
        [matMenuTriggerFor]="profileMenu">

        <!-- Avatar -->
        <div
          class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-blue-900 text-white flex items-center justify-center font-semibold shrink-0 text-xs md:text-sm">
          {{ profile?.name?.charAt(0) || 'A' }}
        </div>

        <div class="text-right hidden sm:block leading-tight">
          <div class="text-sm font-semibold text-gray-800">
            {{ 'Admin' }}
          </div>
          <div class="text-xs text-gray-500">
            {{ 'admin@smartems.com' }}
          </div>
        </div>

      </div>

    </header>

    <!-- CONTENT -->
    <main class="flex-1 p-6 overflow-auto">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>

<!-- PROFILE MENU -->
<mat-menu #profileMenu="matMenu">

  <button mat-menu-item (click)="logout()" class="logout-item">
    <mat-icon>logout</mat-icon>
    Logout
  </button>

</mat-menu>
