<div class="space-y-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-4 gap-4">

    <mat-form-field appearance="outline" class="flex-1 max-w-sm">
      <mat-label>Search employees</mat-label>
      <input matInput placeholder="Name or email..." (input)="onSearch($event)" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="openAddDialog()" [disabled]="isSaving"
      class="flex items-center gap-2">
      <mat-spinner diameter="16" *ngIf="isSaving"></mat-spinner>
      <mat-icon *ngIf="!isSaving">add</mat-icon>
      {{ isSaving ? 'Adding...' : 'Add Employee' }}
    </button>

  </div>

  <!-- GRID CARD -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">

    <!-- LOADING -->
    <div *ngIf="isLoading" class="flex flex-col justify-center items-center h-40 gap-2">
      <mat-spinner></mat-spinner>
      <p class="text-gray-500 text-sm">Loading employees...</p>
    </div>


    <div *ngIf="!isLoading && rowData.length === 0"
      class="flex flex-col items-center justify-center h-40 text-gray-500">
      <mat-icon class="text-4xl text-gray-300">groups</mat-icon>
      <p class="mt-2">No employees found</p>
      <button mat-stroked-button color="primary" class="mt-3" (click)="openAddDialog()">
        Add First Employee
      </button>
    </div>

    <!-- GRID -->
    <ag-grid-angular *ngIf="!isLoading && rowData.length > 0" class="ag-theme-alpine rounded-lg overflow-hidden"
      style="width: 100%; height: 500px" [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true"
      [paginationPageSize]="10" [paginationPageSizeSelector]="false" [domLayout]="'autoHeight'">
    </ag-grid-angular>

  </div>

</div>
