<div class="space-y-6">

  <!-- HEADER -->
  <div>
    <h1 class="text-2xl font-bold text-gray-800">Attendance Corrections</h1>
    <p class="text-gray-500 text-sm">Approve or reject correction requests</p>
  </div>

  <!-- CARD -->
  <div class="bg-white rounded-2xl shadow-md p-4">

    <!-- LOADING -->
    <div *ngIf="isLoading" class="flex justify-center items-center h-40">
      <mat-spinner></mat-spinner>
    </div>

    <!-- GRID -->
    <ag-grid-angular *ngIf="!isLoading" class="ag-theme-alpine rounded-lg" style="width: 100%; height: 500px"
      [rowData]="rowData" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true"
      [paginationPageSize]="10" [paginationPageSizeSelector]="false" [domLayout]="'autoHeight'">
    </ag-grid-angular>

  </div>

</div>
