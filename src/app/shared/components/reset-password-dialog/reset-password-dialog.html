<div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">

  <!-- HEADER -->
  <div class="flex items-center gap-3 px-6 py-4 border-b bg-gray-50">

    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-100 text-blue-600">
      <mat-icon>lock_reset</mat-icon>
    </div>

    <div>
      <h2 class="text-lg font-semibold text-gray-800">
        Reset Password
      </h2>
      <p class="text-sm text-gray-500">
        Set a new password for this user
      </p>
    </div>

  </div>

  <!-- BODY -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="px-6 py-5 space-y-5">

    <!-- PASSWORD -->
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>New Password</mat-label>

      <input
        matInput
        [type]="hidePassword ? 'password' : 'text'"
        formControlName="password"
      />

      <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      <mat-error *ngIf="form.get('password')?.hasError('required')">
        Password is required
      </mat-error>

      <mat-error *ngIf="form.get('password')?.hasError('pattern')">
        Must be at least 6 chars with letters & numbers
      </mat-error>
    </mat-form-field>

    <!-- PASSWORD HINT -->
    <p class="text-xs text-gray-500 -mt-3">
      Use at least 6 characters with letters and numbers
    </p>

    <!-- CONFIRM PASSWORD -->
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>Confirm Password</mat-label>

      <input
        matInput
        [type]="hideConfirmPassword ? 'password' : 'text'"
        formControlName="confirmPassword"
      />

      <button mat-icon-button matSuffix type="button" (click)="toggleConfirmPassword()">
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">
        Confirm password is required
      </mat-error>

      <mat-error *ngIf="form.hasError('passwordMismatch')">
        Passwords do not match
      </mat-error>
    </mat-form-field>

  </form>

  <!-- FOOTER -->
  <div class="flex justify-end gap-3 px-6 py-4 border-t bg-gray-50">

    <button
      mat-button
      type="button"
      (click)="close()"
      class="text-gray-600"
    >
      Cancel
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="submit()"
      [disabled]="form.invalid"
      class="px-6 h-10 rounded-lg"
    >
      Reset Password
    </button>

  </div>

</div>
